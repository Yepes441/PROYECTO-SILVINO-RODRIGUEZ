<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OrientaApp — Institución Educativa Silvino Rodríguez</title>

  <!-- Metadatos para vista previa enriquecida en Discord -->
  <meta property="og:title" content="OrientaApp — I.E. Silvino Rodríguez" />
  <meta property="og:description" content="Plataforma institucional de orientación escolar, bienestar emocional y acompañamiento estudiantil." />
  <meta property="og:image" content="https://yepes441.github.io/PROYECTO-SILVINO-RODRIGUEZ/logo.png" />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#39B500" />

  <!-- Tipografía y librerías -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      /* Paleta extraída directamente del escudo de la I.E. Silvino Rodríguez */
      --silvino-green: #42D900;
      --silvino-green-mid: #32A800;
      --silvino-green-deep: #185800;
      --silvino-gold: #FBCA15;
      --silvino-gold-soft: #FFF8D6;
      --silvino-flame: #FE0C24;
      --silvino-torch: #FAA441;
      --silvino-torch-soft: #FFF1E0;
      --ink: #0F172A;
      --ink-soft: #334155;
      --muted: #64748B;
      --bg: #F3F8F2;
      --card: rgba(255, 255, 255, 0.92);
      --border: rgba(24, 88, 0, 0.12);
      --shadow-sm: 0 6px 18px rgba(24, 88, 0, 0.06);
      --shadow-md: 0 18px 42px rgba(15, 23, 42, 0.09);
      --shadow-lg: 0 28px 70px rgba(15, 23, 42, 0.15);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* Fondo institucional animado con luz, malla sutil y chispas de la antorcha */
    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
      background:
        radial-gradient(circle at 10% 12%, rgba(66, 217, 0, 0.20), transparent 44%),
        radial-gradient(circle at 90% 14%, rgba(251, 202, 21, 0.24), transparent 42%),
        radial-gradient(circle at 82% 85%, rgba(250, 164, 65, 0.18), transparent 45%),
        radial-gradient(circle at 18% 88%, rgba(254, 12, 36, 0.08), transparent 40%),
        linear-gradient(180deg, #F6FBF4 0%, #EEF6EC 100%);
    }

    .grid-overlay {
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image:
        linear-gradient(to right, rgba(24, 88, 0, 0.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(24, 88, 0, 0.035) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(circle at center, black 45%, transparent 92%);
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.6;
      animation: floatOrb 16s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .orb-1 {
      width: 380px;
      height: 380px;
      background: rgba(66, 217, 0, 0.28);
      top: -100px;
      left: -80px;
    }

    .orb-2 {
      width: 320px;
      height: 320px;
      background: rgba(251, 202, 21, 0.34);
      top: 18%;
      right: -90px;
      animation-delay: -5s;
    }

    .orb-3 {
      width: 280px;
      height: 280px;
      background: rgba(250, 164, 65, 0.25);
      bottom: -80px;
      left: 28%;
      animation-delay: -9s;
    }

    /* Partículas flotantes institucionales */
    .sparkles {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
    }

    .spark {
      position: absolute;
      bottom: -20px;
      border-radius: 50%;
      opacity: 0;
      animation: riseSpark linear infinite;
    }

    @keyframes riseSpark {
      0% {
        transform: translateY(0) scale(0.6);
        opacity: 0;
      }
      20% {
        opacity: 0.7;
      }
      80% {
        opacity: 0.45;
      }
      100% {
        transform: translateY(-105vh) scale(1.2);
        opacity: 0;
      }
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 30px) scale(1.1); }
    }

    /* Animaciones de entrada y micro-interacciones */
    .view-enter {
      animation: viewSlideUp 0.52s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes viewSlideUp {
      from {
        opacity: 0;
        transform: translateY(24px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .stagger-1 { animation: viewSlideUp 0.45s 0.05s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .stagger-2 { animation: viewSlideUp 0.45s 0.12s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .stagger-3 { animation: viewSlideUp 0.45s 0.19s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .stagger-4 { animation: viewSlideUp 0.45s 0.26s cubic-bezier(0.16, 1, 0.3, 1) both; }

    /* Barra superior institucional */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: rgba(255, 255, 255, 0.86);
      border-bottom: 1px solid rgba(24, 88, 0, 0.10);
      padding: 12px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.03);
    }

    .topbar::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--silvino-green), var(--silvino-gold), var(--silvino-torch), var(--silvino-flame), var(--silvino-green));
      background-size: 200% 100%;
      animation: shimmerBar 6s linear infinite;
    }

    @keyframes shimmerBar {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      user-select: none;
    }

    .brand-logo-wrap {
      width: 50px;
      height: 50px;
      border-radius: 15px;
      background: #fff;
      padding: 4px;
      display: grid;
      place-items: center;
      box-shadow: 0 6px 18px rgba(66, 217, 0, 0.22);
      border: 2px solid rgba(66, 217, 0, 0.35);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.35s ease;
      overflow: hidden;
    }

    .brand:hover .brand-logo-wrap {
      transform: rotate(-5deg) scale(1.08);
      box-shadow: 0 10px 24px rgba(251, 202, 21, 0.4);
    }

    .brand-logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .brand-text h1 {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-tag {
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 2px 8px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--silvino-green), var(--silvino-green-mid));
      color: #fff;
    }

    .brand-text span {
      font-size: 0.78rem;
      color: var(--silvino-green-deep);
      font-weight: 700;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 15px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      background: #fff;
      color: var(--silvino-green-deep);
      border: 1px solid rgba(66, 217, 0, 0.35);
      box-shadow: var(--shadow-sm);
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--silvino-green);
      box-shadow: 0 0 0 4px rgba(66, 217, 0, 0.25);
      animation: pulseDot 2s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }

    /* Contenedor principal */
    .container {
      width: 100%;
      max-width: 1160px;
      margin: 0 auto;
      padding: 36px 20px 64px;
      flex: 1;
    }

    /* Tarjeta principal glassmorphism */
    .card {
      background: var(--card);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      padding: 40px;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--silvino-green), var(--silvino-gold), var(--silvino-torch), var(--silvino-flame));
    }

    .centered-card {
      max-width: 720px;
      margin: 0 auto;
      text-align: center;
    }

    /* Hero Shield Showcase */
    .shield-showcase {
      position: relative;
      width: 138px;
      height: 138px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
    }

    .shield-halo {
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, var(--silvino-green), var(--silvino-gold), var(--silvino-torch), var(--silvino-flame), var(--silvino-green));
      opacity: 0.35;
      filter: blur(14px);
      animation: spinSlow 10s linear infinite;
    }

    @keyframes spinSlow {
      to { transform: rotate(360deg); }
    }

    .shield-frame {
      position: relative;
      width: 128px;
      height: 128px;
      border-radius: 30px;
      background: #ffffff;
      padding: 10px;
      box-shadow: 0 16px 36px rgba(24, 88, 0, 0.16), inset 0 0 0 2px rgba(66, 217, 0, 0.25);
      display: grid;
      place-items: center;
      animation: gentleFloat 4.5s ease-in-out infinite alternate;
      overflow: hidden;
    }

    @keyframes gentleFloat {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-7px); }
    }

    .shield-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .inst-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(66, 217, 0, 0.14), rgba(251, 202, 21, 0.22));
      border: 1px solid rgba(66, 217, 0, 0.32);
      color: var(--silvino-green-deep);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .hero-title {
      font-size: clamp(1.75rem, 3.5vw, 2.35rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 12px;
      background: linear-gradient(135deg, var(--silvino-green-deep) 0%, var(--silvino-green-mid) 55%, #b47800 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-subtitle {
      color: var(--ink-soft);
      font-size: 1.02rem;
      max-width: 530px;
      margin: 0 auto 30px;
      line-height: 1.65;
    }

    /* Tarjetas de selección de rol */
    .role-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
      margin-bottom: 28px;
    }

    .role-card {
      position: relative;
      text-align: left;
      padding: 24px;
      border-radius: 20px;
      border: 2px solid var(--border);
      background: #ffffff;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      overflow: hidden;
    }

    .role-card::after {
      content: "→";
      position: absolute;
      right: 20px;
      bottom: 20px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 800;
      background: #F1F5F9;
      color: var(--ink);
      transition: all 0.3s ease;
    }

    .role-card.student:hover {
      transform: translateY(-6px);
      border-color: var(--silvino-green);
      box-shadow: 0 18px 36px rgba(66, 217, 0, 0.22);
    }

    .role-card.student:hover::after {
      background: var(--silvino-green);
      color: #fff;
      transform: translateX(4px);
    }

    .role-card.teacher:hover {
      transform: translateY(-6px);
      border-color: var(--silvino-torch);
      box-shadow: 0 18px 36px rgba(250, 164, 65, 0.25);
    }

    .role-card.teacher:hover::after {
      background: var(--silvino-torch);
      color: #fff;
      transform: translateX(4px);
    }

    .role-icon {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      font-size: 1.7rem;
      margin-bottom: 14px;
    }

    .role-card.student .role-icon {
      background: linear-gradient(135deg, rgba(66, 217, 0, 0.18), rgba(251, 202, 21, 0.25));
    }

    .role-card.teacher .role-icon {
      background: linear-gradient(135deg, rgba(250, 164, 65, 0.22), rgba(254, 12, 36, 0.14));
    }

    .role-card h3 {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--ink);
      margin-bottom: 6px;
    }

    .role-card p {
      font-size: 0.86rem;
      color: var(--muted);
      line-height: 1.45;
      padding-right: 34px;
    }

    /* Pilares institucionales */
    .pillars {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding-top: 22px;
      border-top: 1px solid var(--border);
    }

    .pillar-item {
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(24, 88, 0, 0.08);
      border-radius: 14px;
      padding: 12px 10px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--ink-soft);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .pillar-item span:first-child {
      font-size: 1.25rem;
    }

    /* Botones institucionales */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      border-radius: 14px;
      padding: 13px 24px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      text-decoration: none;
      position: relative;
      overflow: hidden;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--silvino-green), var(--silvino-green-mid));
      color: #fff;
      box-shadow: 0 10px 22px rgba(66, 217, 0, 0.30);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(66, 217, 0, 0.40);
    }

    .btn-gold {
      background: linear-gradient(135deg, var(--silvino-gold), var(--silvino-torch));
      color: #1e1b00;
      box-shadow: 0 10px 22px rgba(250, 164, 65, 0.30);
    }

    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(250, 164, 65, 0.42);
    }

    .btn-danger {
      background: linear-gradient(135deg, var(--silvino-flame), #c90014);
      color: #fff;
      box-shadow: 0 10px 22px rgba(254, 12, 36, 0.24);
    }

    .btn-danger:hover {
      transform: translateY(-2px);
    }

    .btn-ghost {
      background: #F1F5F9;
      color: var(--ink);
    }

    .btn-ghost:hover {
      background: #E2E8F0;
    }

    /* Inputs y Textareas */
    .field-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .field-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 8px;
      color: var(--ink);
    }

    .char-counter {
      font-size: 0.76rem;
      color: var(--muted);
      font-weight: 600;
    }

    .input, .textarea, .select-filter {
      width: 100%;
      border: 2px solid #E2E8F0;
      border-radius: 15px;
      padding: 14px 16px;
      font-family: inherit;
      font-size: 0.96rem;
      color: var(--ink);
      background: #FFFFFF;
      transition: border-color 0.22s ease, box-shadow 0.22s ease, transform 0.2s ease;
    }

    .input:focus, .textarea:focus, .select-filter:focus {
      outline: none;
      border-color: var(--silvino-green);
      box-shadow: 0 0 0 4px rgba(66, 217, 0, 0.16);
    }

    .textarea {
      min-height: 130px;
      resize: vertical;
      line-height: 1.55;
    }

    /* Barra de progreso del estudiante con pasos visuales */
    .stepper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 26px;
    }

    .step-pill {
      flex: 1;
      height: 8px;
      border-radius: 999px;
      background: #E2E8F0;
      overflow: hidden;
      position: relative;
    }

    .step-pill.done {
      background: linear-gradient(90deg, var(--silvino-green), var(--silvino-gold));
    }

    .step-pill.active {
      background: linear-gradient(90deg, var(--silvino-green), var(--silvino-torch));
      box-shadow: 0 0 12px rgba(66, 217, 0, 0.45);
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--silvino-green-deep);
      margin-bottom: 10px;
    }

    /* Grid de emociones con animación */
    .emotions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 14px;
      margin: 24px 0;
    }

    .emotion-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 20px 12px;
      border-radius: 20px;
      border: 2px solid #E2E8F0;
      background: #FFFFFF;
      cursor: pointer;
      font-family: inherit;
      font-weight: 800;
      font-size: 0.92rem;
      color: var(--ink);
      transition: all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }

    .emotion-btn .emoji {
      font-size: 2.2rem;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .emotion-btn:hover {
      transform: translateY(-6px) scale(1.03);
      border-color: var(--silvino-green);
      box-shadow: 0 14px 28px rgba(66, 217, 0, 0.18);
    }

    .emotion-btn:hover .emoji {
      transform: scale(1.25) rotate(-8deg);
    }

    .emotion-btn.selected {
      background: linear-gradient(135deg, rgba(66, 217, 0, 0.14), rgba(251, 202, 21, 0.20));
      border-color: var(--silvino-green);
      box-shadow: 0 12px 26px rgba(66, 217, 0, 0.24);
    }

    /* Grid de temas con iconos */
    .topics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin: 24px 0;
    }

    .topic-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px 16px;
      border-radius: 16px;
      border: 2px solid rgba(251, 202, 21, 0.55);
      background: linear-gradient(135deg, #FFFDF2, #FFF8DC);
      color: #5c3c00;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      text-align: left;
    }

    .topic-btn .t-ico {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: #fff;
      display: grid;
      place-items: center;
      font-size: 1.1rem;
      flex-shrink: 0;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.06);
    }

    .topic-btn:hover {
      transform: translateY(-4px) scale(1.01);
      background: linear-gradient(135deg, var(--silvino-gold), var(--silvino-torch));
      border-color: var(--silvino-torch);
      color: #1a1200;
      box-shadow: 0 12px 24px rgba(250, 164, 65, 0.30);
    }

    /* Tarjeta de consejo de bienestar */
    .wellness-tip {
      margin-top: 20px;
      padding: 14px 18px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(66, 217, 0, 0.09), rgba(251, 202, 21, 0.14));
      border: 1px solid rgba(66, 217, 0, 0.24);
      font-size: 0.85rem;
      color: var(--silvino-green-deep);
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
    }

    /* Dashboard del profesor */
    .dash-banner {
      background: linear-gradient(135deg, var(--silvino-green-deep) 0%, #247800 55%, #379900 100%);
      color: #fff;
      border-radius: 24px;
      padding: 26px 30px;
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      box-shadow: 0 18px 40px rgba(24, 88, 0, 0.24);
      position: relative;
      overflow: hidden;
    }

    .dash-banner::after {
      content: "";
      position: absolute;
      right: -40px;
      top: -40px;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(251, 202, 21, 0.35), transparent 70%);
      pointer-events: none;
    }

    .dash-banner-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .dash-logo {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      background: #fff;
      padding: 5px;
      display: grid;
      place-items: center;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      flex-shrink: 0;
    }

    .dash-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 18px;
      margin-bottom: 24px;
    }

    .kpi-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 22px;
      border: 1px solid var(--border);
      border-top: 5px solid var(--silvino-green);
      box-shadow: var(--shadow-sm);
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.28s ease;
    }

    .kpi-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-md);
    }

    .kpi-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--muted);
    }

    .kpi-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 1.3rem;
      background: #F8FAFC;
    }

    .kpi-value {
      font-size: 1.65rem;
      font-weight: 800;
      color: var(--ink);
      word-break: break-word;
    }

    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    .chart-box {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 22px;
      box-shadow: var(--shadow-sm);
    }

    .chart-box.full-width {
      grid-column: 1 / -1;
    }

    .chart-title {
      font-size: 1.02rem;
      font-weight: 800;
      margin-bottom: 16px;
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    /* Barra de búsqueda y filtro en tabla */
    .table-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }

    .table-controls .input {
      flex: 2;
      min-width: 220px;
      padding: 11px 14px;
    }

    .table-controls .select-filter {
      flex: 1;
      min-width: 180px;
      padding: 11px 14px;
    }

    .table-wrap {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 22px;
      box-shadow: var(--shadow-sm);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 720px;
    }

    th {
      text-align: left;
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--silvino-green-deep);
      background: #F4FAF2;
      padding: 13px 14px;
      border-bottom: 2px solid rgba(66, 217, 0, 0.25);
    }

    td {
      padding: 14px;
      border-bottom: 1px solid #F1F5F9;
      font-size: 0.9rem;
      font-weight: 500;
    }

    tr:hover td {
      background: #F8FCF7;
    }

    .badge-emotion {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      background: #F1F5F9;
    }

    /* Footer institucional */
    .footer {
      text-align: center;
      padding: 20px 16px 28px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
    }

    .footer strong {
      color: var(--silvino-green-deep);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 99;
      background: var(--ink);
      color: #fff;
      padding: 14px 20px;
      border-radius: 15px;
      font-weight: 700;
      font-size: 0.9rem;
      box-shadow: var(--shadow-lg);
      transform: translateY(120px);
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .toast.error {
      background: var(--silvino-flame);
    }

    .toast.success {
      background: var(--silvino-green-deep);
    }

    /* Modal detalle */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 60;
    }

    .modal-backdrop.open {
      display: flex;
      animation: fadeIn 0.22s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-card {
      background: #fff;
      border-radius: 24px;
      max-width: 620px;
      width: 100%;
      max-height: 86vh;
      overflow-y: auto;
      padding: 30px;
      box-shadow: var(--shadow-lg);
      border-top: 6px solid var(--silvino-green);
      animation: viewSlideUp 0.32s ease;
    }

    .detail-item {
      background: #F8FAF7;
      border-radius: 14px;
      padding: 13px 16px;
      margin-bottom: 10px;
      border-left: 4px solid var(--silvino-green);
    }

    .detail-item small {
      display: block;
      font-weight: 800;
      color: var(--silvino-green-deep);
      margin-bottom: 4px;
      text-transform: uppercase;
      font-size: 0.72rem;
      letter-spacing: 0.04em;
    }

    .actions-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 22px;
    }

    @media (max-width: 640px) {
      .card {
        padding: 26px 18px;
      }
      .topbar {
        padding: 10px 14px;
      }
      .pillars {
        grid-template-columns: 1fr;
      }
      .brand-text h1 {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="ambient-bg">
    <div class="orb orb-1"></div>

  <!-- Toast -->

  <script>
    // =========================================================================
    // CONFIGURACIÓN DE CONEXIÓN A GOOGLE SHEETS

    // =========================================================================
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxeDdq-_R5o4ldr24FchN_2REBr9Hyfwg3p0F8ZNMDN5GrBDt99zRIjG6OKOtJ_9fnAKw/exec";

    const AUTHORIZED_TEACHERS = {
      "santiagoyepes709@gmail.com": "Profesor 1",

    };

    const EMOTIONS = [
      { label: "😊 Feliz", hint: "¡Qué alegría saber que tienes un buen día!" },
      { label: "😢 Triste", hint: "Está bien sentirse así; estamos aquí para escucharte." },
      { label: "😰 En crisis", hint: "Tu bienestar es prioridad; cuéntanos qué ocurre." },
      { label: "😟 Preocupado", hint: "Compartir lo que te inquieta ayuda a aliviar la carga." },
      { label: "😤 Enojado", hint: "Expresar lo que te molesta de forma segura es un gran paso." },
      { label: "😐 Neutral", hint: "Un día tranquilo también es buen momento para reflexionar." },
      { label: "🤔 Confundido", hint: "Podemos ayudarte a aclarar tus ideas paso a paso." },
      { label: "😌 Tranquilo", hint: "La calma te permite ver todo con mayor claridad." }

    const TOPICS = [

      { name: "Ansiedad", icon: "💭" },

    const DEMO_RECORDS = [
      {
        "Fecha": "2026-11-25 10:15:00",

      {

      }
    ];

    // =========================================================================
    // LOGO INSTITUCIONAL CON FALLBACK SVG DEL ESCUDO SILVINO RODRÍGUEZ
    // =========================================================================
    const FALLBACK_SHIELD_SVG = `
      <svg viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;">
        <path d="M100 10 L188 45 L162 165 L100 210 L38 165 L12 45 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="6"/>
        <path d="M100 18 L155 42 L100 66 L45 42 Z" fill="#FBCA15"/>
        <path d="M42 62 L100 86 L158 62 L142 152 L100 188 L58 152 Z" fill="#42D900"/>
        <path d="M100 32 C108 45 116 55 108 72 L92 72 C84 55 92 45 100 32 Z" fill="#FE0C24"/>
        <rect x="86" y="72" width="28" height="65" rx="4" fill="#FAA441" stroke="#0F172A" stroke-width="2.5"/>
        <path d="M74 134 L100 144 L126 134 L122 162 L100 172 L78 162 Z" fill="#FAA441" stroke="#0F172A" stroke-width="2.5"/>
      </svg>
    `;

    function getLogoImgHtml(alt = "Escudo I.E. Silvino Rodríguez") {
      return `<img src="logo.png" alt="${alt}" onerror="this.outerHTML=FALLBACK_SHIELD_SVG">`;
    }

    document.getElementById("topLogoWrap").innerHTML = getLogoImgHtml();

    // Generar partículas flotantes institucionales
    (function initSparkles() {
      const container = document.getElementById("sparkles");
      const colors = ["#42D900", "#FBCA15", "#FAA441", "#FE0C24"];
      for (let i = 0; i < 18; i++) {
        const s = document.createElement("span");
        s.className = "spark";
        const size = Math.random() * 7 + 4;
        s.style.width = `${size}px`;
        s.style.height = `${size}px`;
        s.style.left = `${Math.random() * 100}%`;
        s.style.background = colors[i % colors.length];
        s.style.animationDuration = `${Math.random() * 12 + 10}s`;
        s.style.animationDelay = `${Math.random() * 10}s`;
        container.appendChild(s);
      }
    })();

    // =========================================================================
    // ESTADO GLOBAL
    // =========================================================================
    const state = {
      role: null,
      userName: "",
      studentData: {
        emotion: "",
        emotionReason: "",
        topic: "",
        topicDetail: "",
        importantSituation: ""
      },
      records: [],
      filteredRecords: [],
      charts: []
    };

    const appEl = document.getElementById("app");
    document.getElementById("statusText").textContent = APPS_SCRIPT_URL ? "Conectado a Sheets" : "Modo Demo";

    // =========================================================================
    // UTILIDADES
    // =========================================================================
    function showToast(msg, type = "info") {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.className = `toast show ${type}`;
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        toast.className = "toast";
      }, 3200);
    }

    function renderView(html) {
      destroyCharts();
      appEl.innerHTML = `<div class="view-enter">${html}</div>`;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function destroyCharts() {
      state.charts.forEach(ch => ch.destroy());
      state.charts = [];
    }

    function goHome() {
      state.role = null;
      state.userName = "";
      state.studentData = {
        emotion: "",
        emotionReason: "",
        topic: "",
        topicDetail: "",
        importantSituation: ""
      };
      showLoginOptions();
    }

    // =========================================================================
    // PANTALLA DE INICIO Y ROLES
    // =========================================================================
    function showLoginOptions() {
      renderView(`
        <div class="card centered-card">
          <div class="shield-showcase stagger-1">
            <div class="shield-halo"></div>
            <div class="shield-frame">
              ${getLogoImgHtml()}
            </div>
          </div>

          <div class="inst-eyebrow stagger-1">🏫 Institución Educativa Silvino Rodríguez</div>

          <h2 class="hero-title stagger-2">
            Bienvenido a OrientaApp
          </h2>

          <p class="hero-subtitle stagger-2">
            Tu espacio confidencial de escucha activa, acompañamiento emocional y orientación escolar. Selecciona tu perfil para continuar:
          </p>

          <div class="role-grid stagger-3">
            <button type="button" class="role-card student" onclick="showStudentLogin()">
              <div class="role-icon">🎓</div>
              <h3>Soy Estudiante</h3>
              <p>Comparte cómo te sientes hoy y solicita apoyo o guía en el tema que necesites.</p>
            </button>

            <button type="button" class="role-card teacher" onclick="showTeacherLogin()">
              <div class="role-icon">👨‍🏫</div>
              <h3>Soy Profesor</h3>
              <p>Accede al panel estadístico institucional y realiza seguimiento a los estudiantes.</p>
            </button>
          </div>

          <div class="pillars stagger-4">
            <div class="pillar-item">
              <span>🔒</span>
              <span>100% Confidencial</span>
            </div>
            <div class="pillar-item">
              <span>💚</span>
              <span>Escucha y Apoyo</span>
            </div>
            <div class="pillar-item">
              <span>📊</span>
              <span>Seguimiento Activo</span>
            </div>
          </div>
        </div>
      `);
    }

    function showStudentLogin() {
      renderView(`
        <div class="card centered-card">
          <div class="shield-showcase" style="width:96px;height:96px;margin-bottom:14px;">
            <div class="shield-frame" style="width:90px;height:90px;border-radius:22px;">
              ${getLogoImgHtml()}
            </div>
          </div>

          <div class="inst-eyebrow">🎓 Portal Estudiantil</div>
          <h2 style="font-size: 1.65rem; font-weight: 800; margin-bottom: 8px;">¿Cómo te llamas?</h2>
          <p style="color: var(--muted); margin-bottom: 24px;">Ingresa tu nombre para iniciar tu espacio de orientación.</p>

          <div class="field-group">
            <label class="field-label" for="studentNameInput">Nombre completo del estudiante</label>
            <input id="studentNameInput" class="input" type="text" placeholder="Ej. Camila Andrea Torres..." onkeydown="if(event.key==='Enter') handleStudentLogin()" />
          </div>

          <div class="actions-row">
            <button class="btn btn-primary" onclick="handleStudentLogin()">Comenzar ahora →</button>
            <button class="btn btn-ghost" onclick="showLoginOptions()">Volver</button>
          </div>
        </div>
      `);
    }

    function handleStudentLogin() {
      const name = document.getElementById("studentNameInput").value.trim();
      if (!name) {
        showToast("Por favor ingresa tu nombre", "error");
        return;
      }
      state.role = "student";
      state.userName = name;
      showEmotionStep();
    }

    function showTeacherLogin() {
      renderView(`
        <div class="card centered-card">
          <div class="shield-showcase" style="width:96px;height:96px;margin-bottom:14px;">
            <div class="shield-frame" style="width:90px;height:90px;border-radius:22px;">
              ${getLogoImgHtml()}
            </div>
          </div>

          <div class="inst-eyebrow">👨‍🏫 Portal Docente</div>
          <h2 style="font-size: 1.65rem; font-weight: 800; margin-bottom: 8px;">Acceso a Orientación Escolar</h2>
          <p style="color: var(--muted); margin-bottom: 24px;">Ingresa tu correo autorizado para visualizar el panel institucional.</p>

          <div class="field-group">
            <label class="field-label" for="teacherEmailInput">Correo institucional</label>

          </div>

          <div class="actions-row">
            <button class="btn btn-gold" onclick="handleTeacherLogin()">Ingresar al Dashboard →</button>
            <button class="btn btn-ghost" onclick="showLoginOptions()">Volver</button>
          </div>
        </div>
      `);
    }

    function handleTeacherLogin() {
      const email = document.getElementById("teacherEmailInput").value.trim().toLowerCase();
      if (AUTHORIZED_TEACHERS[email]) {
        state.role = "teacher";
        state.userName = AUTHORIZED_TEACHERS[email];
        showToast(`Bienvenido, ${state.userName}`, "success");
        showTeacherDashboard();
      } else {
        showToast("Correo no autorizado", "error");
      }
    }

    // =========================================================================
    // FLUJO ESTUDIANTE
    // =========================================================================
    function renderStepper(stepNum, stepTitle) {
      const pills = [1, 2, 3, 4, 5].map(n => {
        const cls = n < stepNum ? "done" : (n === stepNum ? "active" : "");
        return `<div class="step-pill ${cls}"></div>`;
      }).join("");

      return `
        <div>
          <div class="progress-meta">
            <span>Paso ${stepNum} de 5 · ${stepTitle}</span>
            <span>${stepNum * 20}%</span>
          </div>
          <div class="stepper">${pills}</div>
        </div>
      `;
    }

    function showEmotionStep() {
      const buttonsHtml = EMOTIONS.map(em => {
        const [emoji, ...rest] = em.label.split(" ");
        const text = rest.join(" ");
        const isSelected = state.studentData.emotion === em.label ? "selected" : "";
        return `
          <button type="button" class="emotion-btn ${isSelected}" onclick="selectEmotion('${em.label.replace(/'/g, "\'")}')">
            <span class="emoji">${emoji}</span>
            <span>${text}</span>
          </button>
        `;
      }).join("");

      renderView(`
        <div class="card centered-card">
          ${renderStepper(1, "Estado emocional")}
          <h2 style="font-size: 1.7rem; font-weight: 800; color: var(--silvino-green-deep);">
            ¿Cómo te sientes hoy, ${escapeHtml(state.userName)}?
          </h2>
          <p style="color: var(--muted); margin-top: 8px;">Toca la emoción que mejor represente tu estado de ánimo en este momento.</p>

          <div class="emotions-grid">
            ${buttonsHtml}
          </div>

          <div class="actions-row">
            <button class="btn btn-ghost" onclick="goHome()">Cancelar</button>
          </div>
        </div>
      `);
    }

    function selectEmotion(emotion) {
      state.studentData.emotion = emotion;
      showEmotionReasonStep();
    }

    function showEmotionReasonStep() {
      const found = EMOTIONS.find(e => e.label === state.studentData.emotion);
      const hint = found ? found.hint : "Gracias por compartir cómo te sientes.";

      renderView(`
        <div class="card centered-card">
          ${renderStepper(2, "Contexto emocional")}
          <div class="inst-eyebrow">Has seleccionado: ${escapeHtml(state.studentData.emotion)}</div>
          <h2 style="font-size: 1.6rem; font-weight: 800; margin-bottom: 14px;">
            ¿Por qué te sientes así?
          </h2>

          <div class="field-group">
            <label class="field-label" for="reasonTextarea">
              <span>Tu respuesta</span>
              <span class="char-counter" id="reasonCount">${state.studentData.emotionReason.length} caracteres</span>
            </label>
            <textarea id="reasonTextarea" class="textarea" oninput="updateCounter('reasonTextarea','reasonCount')" placeholder="Cuéntanos qué ha ocurrido hoy o qué te hace sentir así...">${escapeHtml(state.studentData.emotionReason)}</textarea>
          </div>

          <div class="wellness-tip">
            <span>💡</span>
            <span>${escapeHtml(hint)}</span>
          </div>

          <div class="actions-row">
            <button class="btn btn-ghost" onclick="showEmotionStep()">← Atrás</button>
            <button class="btn btn-primary" onclick="saveReasonAndContinue()">Continuar →</button>
          </div>
        </div>
      `);
    }

    function saveReasonAndContinue() {
      const val = document.getElementById("reasonTextarea").value.trim();
      if (!val) {
        showToast("Por favor explica por qué te sientes así", "error");
        return;
      }
      state.studentData.emotionReason = val;
      showTopicStep();
    }

    function showTopicStep() {
      const topicsHtml = TOPICS.map(t => `
        <button type="button" class="topic-btn" onclick="selectTopic('${t.name.replace(/'/g, "\'")}')">
          <span class="t-ico">${t.icon}</span>
          <span>${escapeHtml(t.name)}</span>
        </button>
      `).join("");

      renderView(`
        <div class="card centered-card">
          ${renderStepper(3, "Tema de orientación")}
          <h2 style="font-size: 1.6rem; font-weight: 800; color: var(--silvino-green-deep);">
            ¿En qué te gustaría que te orientaran?
          </h2>
          <p style="color: var(--muted); margin-top: 8px;">Selecciona el tema principal en el que deseas recibir acompañamiento.</p>

          <div class="topics-grid">
            ${topicsHtml}
          </div>

          <div class="actions-row">
            <button class="btn btn-ghost" onclick="showEmotionReasonStep()">← Atrás</button>
          </div>
        </div>
      `);
    }

    function selectTopic(topic) {
      state.studentData.topic = topic;
      showTopicDetailStep();
    }

    function showTopicDetailStep() {
      renderView(`
        <div class="card centered-card">
          ${renderStepper(4, "Detalles del tema")}
          <div class="inst-eyebrow" style="background: var(--silvino-gold-soft); border-color: var(--silvino-gold); color: #694900;">
            Tema: ${escapeHtml(state.studentData.topic)}
          </div>
          <h2 style="font-size: 1.6rem; font-weight: 800; margin-bottom: 16px;">
            Cuéntanos más sobre esto:
          </h2>

          <div class="field-group">
            <label class="field-label" for="topicDetailTextarea">
              <span>Detalles</span>
              <span class="char-counter" id="detailCount">${state.studentData.topicDetail.length} caracteres</span>
            </label>
            <textarea id="topicDetailTextarea" class="textarea" oninput="updateCounter('topicDetailTextarea','detailCount')" placeholder="Describe lo que estás viviendo o qué tipo de orientación te ayudaría...">${escapeHtml(state.studentData.topicDetail)}</textarea>
          </div>

          <div class="actions-row">
            <button class="btn btn-ghost" onclick="showTopicStep()">← Atrás</button>
            <button class="btn btn-primary" onclick="saveTopicAndContinue()">Continuar →</button>
          </div>
        </div>
      `);
    }

    function saveTopicAndContinue() {
      const val = document.getElementById("topicDetailTextarea").value.trim();
      if (!val) {
        showToast("Por favor cuéntanos más sobre el tema seleccionado", "error");
        return;
      }
      state.studentData.topicDetail = val;
      showImportantStep();
    }

    function showImportantStep() {
      renderView(`
        <div class="card centered-card">
          ${renderStepper(5, "Situación importante")}
          <h2 style="font-size: 1.6rem; font-weight: 800; color: var(--silvino-green-deep); margin-bottom: 8px;">
            ¿Hay alguna situación que hoy te afecte mucho?
          </h2>
          <p style="color: var(--muted); margin-bottom: 18px;">Compártenos con total confianza; este espacio es seguro para ti:</p>

          <div class="field-group">
            <label class="field-label" for="importantTextarea">
              <span>Tu mensaje</span>
              <span class="char-counter" id="impCount">${state.studentData.importantSituation.length} caracteres</span>
            </label>
            <textarea id="importantTextarea" class="textarea" oninput="updateCounter('importantTextarea','impCount')" placeholder="Escribe aquí con libertad...">${escapeHtml(state.studentData.importantSituation)}</textarea>
          </div>

          <div class="actions-row">
            <button class="btn btn-ghost" onclick="showTopicDetailStep()">← Atrás</button>
            <button class="btn btn-primary" id="submitBtn" onclick="submitStudentResponses()">Enviar respuestas ✨</button>
          </div>
        </div>
      `);
    }

    function updateCounter(textareaId, counterId) {
      const len = document.getElementById(textareaId).value.length;
      document.getElementById(counterId).textContent = `${len} caracteres`;
    }

    async function submitStudentResponses() {
      const val = document.getElementById("importantTextarea").value.trim();
      if (!val) {
        showToast("Por favor compártenos tu situación importante", "error");
        return;
      }
      state.studentData.importantSituation = val;

      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.textContent = "Guardando...";

      const payload = {
        studentName: state.userName,
        emotion: state.studentData.emotion,
        emotionReason: state.studentData.emotionReason,
        topic: state.studentData.topic,
        topicDetail: state.studentData.topicDetail,
        importantSituation: state.studentData.importantSituation
      };

      let savedOk = false;

      if (APPS_SCRIPT_URL) {
        try {
          await fetch(APPS_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          savedOk = true;
        } catch (err) {
          console.error(err);
          savedOk = false;
        }
      } else {
        DEMO_RECORDS.push({
          "Fecha": new Date().toISOString().replace("T", " ").slice(0, 19),
          "Nombre Estudiante": payload.studentName,
          "Emoción": payload.emotion,
          "Razón Emoción": payload.emotionReason,
          "Tema Orientación": payload.topic,
          "Detalle Tema": payload.topicDetail,
          "Situación Importante": payload.importantSituation,
          "Tiempo Respuesta": "Completado"
        });
        savedOk = true;
      }

      if (savedOk && typeof confetti === "function") {
        confetti({
          particleCount: 90,
          spread: 75,
          origin: { y: 0.6 },
          colors: ["#42D900", "#FBCA15", "#FAA441", "#FE0C24"]
        });
      }

      renderView(`
        <div class="card centered-card">
          <div class="shield-showcase" style="width:110px;height:110px;margin-bottom:14px;">
            <div class="shield-halo"></div>
            <div class="shield-frame" style="width:102px;height:102px;border-radius:24px;">
              ${getLogoImgHtml()}
            </div>
          </div>

          <h2 style="font-size: 1.75rem; font-weight: 800; color: ${savedOk ? "var(--silvino-green-deep)" : "var(--silvino-flame)"}; margin-bottom: 12px;">
            ${savedOk ? "¡Gracias por compartir tu experiencia! ✨" : "Hubo un error al guardar"}
          </h2>
          <p style="color: var(--ink-soft); line-height: 1.65; max-width: 480px; margin: 0 auto 26px;">
            ${savedOk
              ? "Tus respuestas han sido guardadas exitosamente en el sistema de Orientación Escolar de la Institución Educativa Silvino Rodríguez."
              : "No se pudo establecer comunicación con el servidor. Por favor intenta nuevamente."}
          </p>
          <div class="actions-row">
            <button class="btn btn-primary" onclick="goHome()">Finalizar y volver al inicio</button>
          </div>
        </div>
      `);
    }

    // =========================================================================
    // DASHBOARD PROFESOR
    // =========================================================================
    async function showTeacherDashboard() {
      renderView(`
        <div class="dash-banner">
          <div class="dash-banner-left">
            <div class="dash-logo">${getLogoImgHtml()}</div>
            <div>
              <div style="font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--silvino-gold);">
                Institución Educativa Silvino Rodríguez
              </div>
              <h2 style="font-size: 1.55rem; font-weight: 800; margin: 2px 0;">
                Dashboard de Orientación Escolar
              </h2>
              <p style="font-size: 0.88rem; opacity: 0.92;">
                👨‍🏫 Sesión activa: <strong>${escapeHtml(state.userName)}</strong>
              </p>
            </div>
          </div>

          <div style="display:flex; gap:10px; flex-wrap:wrap; position:relative; z-index:2;">
            <button class="btn btn-gold" onclick="loadTeacherData()">🔄 Actualizar Datos</button>
            <button class="btn btn-danger" onclick="goHome()">🚪 Cerrar Sesión</button>
          </div>
        </div>

        <div id="dashboardContent">
          <div class="card centered-card">Cargando registros desde Google Sheets...</div>
        </div>
      `);

      await loadTeacherData();
    }

    async function loadTeacherData() {
      const contentEl = document.getElementById("dashboardContent");
      if (!contentEl) return;

      let records = [];
      if (APPS_SCRIPT_URL) {
        try {
          const resp = await fetch(APPS_SCRIPT_URL);
          records = await resp.json();
        } catch (e) {
          showToast("No se pudo leer Google Sheets; mostrando respaldo", "error");
          records = DEMO_RECORDS;
        }
      } else {
        records = DEMO_RECORDS;
      }

      state.records = Array.isArray(records) ? records : [];
      state.filteredRecords = [...state.records];
      destroyCharts();

      if (state.records.length === 0) {
        contentEl.innerHTML = `
          <div class="card centered-card">
            <div style="font-size: 3.5rem; margin-bottom: 12px;">📭</div>
            <h3 style="font-size: 1.35rem; font-weight: 800; margin-bottom: 8px;">No hay respuestas registradas todavía</h3>
            <p style="color: var(--muted);">Las respuestas de los estudiantes aparecerán aquí automáticamente.</p>
          </div>
        `;
        return;
      }

      const total = state.records.length;
      const emotionCounts = countBy(state.records, "Emoción");
      const topicCounts = countBy(state.records, "Tema Orientación");
      const uniqueStudents = new Set(state.records.map(r => r["Nombre Estudiante"]).filter(Boolean)).size;

      const topEmotion = emotionCounts[0] ? `${emotionCounts[0][0]} (${emotionCounts[0][1]})` : "N/A";
      const topTopic = topicCounts[0] ? `${topicCounts[0][0]} (${topicCounts[0][1]})` : "N/A";

      const topicOptions = topicCounts.map(([t]) => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join("");

      contentEl.innerHTML = `
        <div class="kpi-grid">
          <div class="kpi-card stagger-1" style="border-top-color: var(--silvino-green);">
            <div class="kpi-top"><span>Total de Respuestas</span><span class="kpi-icon">📋</span></div>
            <div class="kpi-value" style="color: var(--silvino-green-deep);">${total}</div>
          </div>
          <div class="kpi-card stagger-2" style="border-top-color: var(--silvino-gold);">
            <div class="kpi-top"><span>Emoción más común</span><span class="kpi-icon">😊</span></div>
            <div class="kpi-value" style="font-size: 1.25rem;">${escapeHtml(topEmotion)}</div>
          </div>
          <div class="kpi-card stagger-3" style="border-top-color: var(--silvino-torch);">
            <div class="kpi-top"><span>Tema más consultado</span><span class="kpi-icon">📚</span></div>
            <div class="kpi-value" style="font-size: 1.18rem;">${escapeHtml(topTopic)}</div>
          </div>
          <div class="kpi-card stagger-4" style="border-top-color: var(--silvino-flame);">
            <div class="kpi-top"><span>Estudiantes atendidos</span><span class="kpi-icon">👨‍🎓</span></div>
            <div class="kpi-value" style="color: var(--silvino-flame);">${uniqueStudents}</div>
          </div>
        </div>

        <div class="charts-grid">
          <div class="chart-box">
            <div class="chart-title"><span>📊 Distribución de Emociones</span></div>
            <canvas id="emotionChart"></canvas>
          </div>
          <div class="chart-box">
            <div class="chart-title"><span>📚 Temas de Orientación</span></div>
            <canvas id="topicChart"></canvas>
          </div>
          <div class="chart-box full-width">
            <div class="chart-title"><span>📈 Tendencia de Respuestas por Día</span></div>
            <canvas id="timelineChart"></canvas>
          </div>
        </div>

        <div class="table-wrap">
          <div class="chart-title">
            <span>📝 Registro de Respuestas Estudiantiles</span>
            <span style="font-size:0.8rem;color:var(--muted);font-weight:600;" id="tableCountBadge">${total} registros</span>
          </div>

          <div class="table-controls">
            <input id="searchStudentInput" class="input" type="text" placeholder="🔍 Buscar por nombre de estudiante o emoción..." oninput="applyTableFilters()" />
            <select id="filterTopicSelect" class="select-filter" onchange="applyTableFilters()">
              <option value="">Todos los temas</option>
              ${topicOptions}
            </select>
          </div>

          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Estudiante</th>
                <th>Emoción</th>
                <th>Tema</th>
                <th>Fecha</th>
                <th>Detalles</th>
              </tr>
            </thead>
            <tbody id="responsesTableBody"></tbody>
          </table>
        </div>
      `;

      renderCharts(state.records, emotionCounts, topicCounts);
      applyTableFilters();
    }

    function applyTableFilters() {
      const query = (document.getElementById("searchStudentInput")?.value || "").toLowerCase().trim();
      const topicFilter = document.getElementById("filterTopicSelect")?.value || "";

      const sorted = [...state.records].sort((a, b) =>
        String(b["Fecha"] || "").localeCompare(String(a["Fecha"] || ""))
      );

      state.filteredRecords = sorted.filter(row => {
        const name = String(row["Nombre Estudiante"] || "").toLowerCase();
        const emo = String(row["Emoción"] || "").toLowerCase();
        const topic = String(row["Tema Orientación"] || "");
        const matchesQuery = !query || name.includes(query) || emo.includes(query);
        const matchesTopic = !topicFilter || topic === topicFilter;
        return matchesQuery && matchesTopic;
      });

      const badge = document.getElementById("tableCountBadge");
      if (badge) badge.textContent = `${state.filteredRecords.length} registros`;

      const tbody = document.getElementById("responsesTableBody");
      if (!tbody) return;

      if (state.filteredRecords.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:24px;color:var(--muted);">No se encontraron coincidencias con el filtro aplicado.</td></tr>`;
        return;
      }

      tbody.innerHTML = state.filteredRecords.slice(0, 50).map((row, idx) => `
        <tr>
          <td><strong>${idx + 1}</strong></td>
          <td><strong>${escapeHtml(row["Nombre Estudiante"] || "")}</strong></td>
          <td><span class="badge-emotion">${escapeHtml(row["Emoción"] || "")}</span></td>
          <td>${escapeHtml(row["Tema Orientación"] || "")}</td>
          <td>${escapeHtml(String(row["Fecha"] || "").slice(0, 16))}</td>
          <td>
            <button class="btn btn-primary" style="padding: 7px 14px; font-size: 0.8rem; border-radius: 10px;" onclick="openDetailModal(${idx})">
              🔍 Ver
            </button>
          </td>
        </tr>
      `).join("");
    }

    function countBy(records, key) {
      const map = {};
      records.forEach(r => {
        const val = r[key] || "Sin especificar";
        map[val] = (map[val] || 0) + 1;
      });
      return Object.entries(map).sort((a, b) => b[1] - a[1]);
    }

    function renderCharts(records, emotionCounts, topicCounts) {
      const palette = ["#42D900", "#FBCA15", "#FAA441", "#FE0C24", "#185800", "#0EA5E9", "#8B5CF6", "#EC4899"];

      const c1 = new Chart(document.getElementById("emotionChart"), {
        type: "bar",
        data: {
          labels: emotionCounts.map(x => x[0]),
          datasets: [{
            label: "Estudiantes",
            data: emotionCounts.map(x => x[1]),
            backgroundColor: palette,
            borderRadius: 10
          }]
        },
        options: {
          indexAxis: "y",
          responsive: true,
          plugins: { legend: { display: false } }
        }
      });

      const c2 = new Chart(document.getElementById("topicChart"), {
        type: "doughnut",
        data: {
          labels: topicCounts.map(x => x[0]),
          datasets: [{
            data: topicCounts.map(x => x[1]),
            backgroundColor: palette,
            borderWidth: 2,
            borderColor: "#ffffff"
          }]
        },
        options: {
          responsive: true,
          cutout: "62%",
          plugins: { legend: { position: "bottom" } }
        }
      });

      const dateMap = {};
      records.forEach(r => {
        const d = String(r["Fecha"] || "").slice(0, 10) || "Sin fecha";
        dateMap[d] = (dateMap[d] || 0) + 1;
      });
      const sortedDates = Object.keys(dateMap).sort();

      const c3 = new Chart(document.getElementById("timelineChart"), {
        type: "line",
        data: {
          labels: sortedDates,
          datasets: [{
            label: "Respuestas",
            data: sortedDates.map(d => dateMap[d]),
            borderColor: "#32A800",
            backgroundColor: "rgba(66, 217, 0, 0.18)",
            fill: true,
            tension: 0.38,
            pointRadius: 5,
            pointBackgroundColor: "#FBCA15",
            pointBorderColor: "#185800",
            pointBorderWidth: 2
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } }
        }
      });

      state.charts.push(c1, c2, c3);
    }

    function openDetailModal(index) {
      const item = state.filteredRecords[index];
      if (!item) return;

      const fields = [
        ["👨‍🎓 Estudiante", item["Nombre Estudiante"]],
        ["📅 Fecha y Hora", item["Fecha"]],
        ["😊 Emoción", item["Emoción"]],
        ["💭 Razón de la Emoción", item["Razón Emoción"]],
        ["📚 Tema de Orientación", item["Tema Orientación"]],
        ["✏️ Detalle del Tema", item["Detalle Tema"]],
        ["❤️ Situación Importante", item["Situación Importante"]]
      ];

      document.getElementById("detailModalContent").innerHTML = `
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px;">
          <div style="width:44px;height:44px;">${getLogoImgHtml()}</div>
          <div>
            <div style="font-size:0.72rem;font-weight:800;color:var(--silvino-green-deep);text-transform:uppercase;">I.E. Silvino Rodríguez</div>
            <h3 style="font-size: 1.3rem; font-weight: 800; color: var(--ink);">📋 Detalle de la Respuesta</h3>
          </div>
        </div>

        ${fields.map(([label, val]) => `
          <div class="detail-item">
            <small>${label}</small>
            <div style="line-height:1.5;">${escapeHtml(val || "No especificado")}</div>
          </div>
        `).join("")}

        <div class="actions-row">
          <button class="btn btn-primary" onclick="closeModal()">Cerrar</button>
        </div>
      `;
      document.getElementById("detailModal").classList.add("open");
    }

    function closeModal() {
      document.getElementById("detailModal").classList.remove("open");
    }

    function closeModalOnBackdrop(e) {
      if (e.target.id === "detailModal") closeModal();
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Iniciar aplicación
    showLoginOptions();
  </script>
</body>
</html>
