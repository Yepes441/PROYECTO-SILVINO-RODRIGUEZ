<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OrientaApp — Bienestar y Orientación Escolar</title>

  <!-- Metadatos para vista previa enriquecida en Discord -->
  <meta property="og:title" content="OrientaApp — Orientación y Bienestar" />
  <meta property="og:description" content="Espacio confidencial de escucha, acompañamiento emocional y orientación estudiantil." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#42D900" />

  <!-- Fuentes y Chart.js para gráficas interactivas -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --primary: #42D900;
      --primary-dark: #32a800;
      --primary-soft: rgba(66, 217, 0, 0.12);
      --secondary: #FBCA15;
      --danger: #FE0C24;
      --warning: #FAA441;
      --dark: #0F172A;
      --muted: #64748B;
      --bg: #F4F7F5;
      --card: #FFFFFF;
      --border: #E2E8F0;
      --shadow-sm: 0 4px 14px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 12px 32px rgba(15, 23, 42, 0.09);
      --shadow-lg: 0 24px 60px rgba(15, 23, 42, 0.14);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--dark);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Fondo animado con orbes suaves */
    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 15%, rgba(66, 217, 0, 0.14), transparent 42%),
        radial-gradient(circle at 88% 20%, rgba(251, 202, 21, 0.16), transparent 40%),
        radial-gradient(circle at 50% 90%, rgba(250, 164, 65, 0.12), transparent 45%),
        var(--bg);
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.55;
      animation: floatOrb 14s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 320px;
      height: 320px;
      background: rgba(66, 217, 0, 0.25);
      top: -80px;
      left: -60px;
    }

    .orb-2 {
      width: 260px;
      height: 260px;
      background: rgba(251, 202, 21, 0.28);
      bottom: -60px;
      right: -40px;
      animation-delay: -5s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(35px, 25px) scale(1.08); }
    }

    /* Animación de entrada de vistas */
    .view-enter {
      animation: viewFadeUp 0.42s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes viewFadeUp {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.99);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Barra superior */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      backdrop-filter: blur(14px);
      background: rgba(255, 255, 255, 0.85);
      border-bottom: 1px solid rgba(226, 232, 240, 0.8);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      user-select: none;
    }

    .brand-badge {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), #6cf52f);
      display: grid;
      place-items: center;
      font-size: 22px;
      box-shadow: 0 8px 20px rgba(66, 217, 0, 0.3);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .brand:hover .brand-badge {
      transform: rotate(-8deg) scale(1.08);
    }

    .brand-text h1 {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .brand-text span {
      font-size: 0.76rem;
      color: var(--muted);
      font-weight: 600;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      background: #F1F5F9;
      color: var(--dark);
      border: 1px solid var(--border);
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 0 4px rgba(66, 217, 0, 0.22);
      animation: pulseDot 2s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.25); }
    }

    /* Contenedor principal */
    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 32px 20px 64px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      padding: 36px;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .centered-card {
      max-width: 660px;
      margin: 0 auto;
      text-align: center;
    }

    /* Botones profesionales */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      border-radius: 14px;
      padding: 13px 24px;
      font-family: inherit;
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      text-decoration: none;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      box-shadow: 0 8px 20px rgba(66, 217, 0, 0.28);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 26px rgba(66, 217, 0, 0.38);
    }

    .btn-warning {
      background: linear-gradient(135deg, var(--warning), #f28c1d);
      color: #fff;
      box-shadow: 0 8px 20px rgba(250, 164, 65, 0.28);
    }

    .btn-warning:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 26px rgba(250, 164, 65, 0.38);
    }

    .btn-danger {
      background: linear-gradient(135deg, var(--danger), #d60016);
      color: #fff;
      box-shadow: 0 8px 20px rgba(254, 12, 36, 0.22);
    }

    .btn-danger:hover {
      transform: translateY(-2px);
    }

    .btn-ghost {
      background: #F1F5F9;
      color: var(--dark);
    }

    .btn-ghost:hover {
      background: #E2E8F0;
    }

    /* Inputs y Textareas */
    .field-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .field-label {
      display: block;
      font-weight: 700;
      font-size: 0.92rem;
      margin-bottom: 8px;
      color: var(--dark);
    }

    .input, .textarea {
      width: 100%;
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      font-family: inherit;
      font-size: 0.96rem;
      color: var(--dark);
      background: #FAFCFB;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .input:focus, .textarea:focus {
      outline: none;
      background: #fff;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(66, 217, 0, 0.16);
    }

    .textarea {
      min-height: 120px;
      resize: vertical;
      line-height: 1.5;
    }

    /* Barra de progreso del estudiante */
    .progress-wrap {
      margin-bottom: 26px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .progress-track {
      height: 9px;
      background: #E2E8F0;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 20%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      border-radius: 999px;
      transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Grid de emociones */
    .emotions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
      gap: 14px;
      margin: 24px 0;
    }

    .emotion-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 18px 12px;
      border-radius: 18px;
      border: 2px solid transparent;
      background: #F8FAFC;
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.92rem;
      color: var(--dark);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .emotion-btn .emoji {
      font-size: 2rem;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .emotion-btn:hover {
      transform: translateY(-4px) scale(1.02);
      background: #fff;
      box-shadow: var(--shadow-sm);
    }

    .emotion-btn:hover .emoji {
      transform: scale(1.22) rotate(-6deg);
    }

    .emotion-btn.selected {
      background: var(--primary-soft);
      border-color: var(--primary);
      box-shadow: 0 8px 22px rgba(66, 217, 0, 0.22);
    }

    /* Grid de temas */
    .topics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      margin: 24px 0;
    }

    .topic-btn {
      padding: 14px 16px;
      border-radius: 14px;
      border: 2px solid #FDE68A;
      background: #FFFBEB;
      color: #78350F;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      text-align: center;
    }

    .topic-btn:hover {
      transform: translateY(-3px);
      background: var(--warning);
      border-color: var(--warning);
      color: #fff;
      box-shadow: 0 8px 18px rgba(250, 164, 65, 0.28);
    }

    /* Dashboard del profesor */
    .dash-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      margin-bottom: 24px;
    }

    .kpi-card {
      background: #fff;
      border-radius: 18px;
      padding: 20px;
      border: 1px solid var(--border);
      border-top: 4px solid var(--primary);
      box-shadow: var(--shadow-sm);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .kpi-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
    }

    .kpi-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--muted);
    }

    .kpi-icon {
      font-size: 1.5rem;
    }

    .kpi-value {
      font-size: 1.55rem;
      font-weight: 800;
      color: var(--dark);
      word-break: break-word;
    }

    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    .chart-box {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: var(--shadow-sm);
    }

    .chart-box.full-width {
      grid-column: 1 / -1;
    }

    .chart-title {
      font-size: 1rem;
      font-weight: 800;
      margin-bottom: 14px;
      color: var(--dark);
    }

    .table-wrap {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: var(--shadow-sm);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 680px;
    }

    th {
      text-align: left;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      padding: 12px 14px;
      border-bottom: 2px solid var(--border);
    }

    td {
      padding: 13px 14px;
      border-bottom: 1px solid #F1F5F9;
      font-size: 0.9rem;
      font-weight: 500;
    }

    tr:hover td {
      background: #F8FAFC;
    }

    /* Toast / Alertas */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 99;
      background: var(--dark);
      color: #fff;
      padding: 14px 20px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 0.9rem;
      box-shadow: var(--shadow-lg);
      transform: translateY(120px);
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .toast.error {
      background: var(--danger);
    }

    .toast.success {
      background: #15803d;
    }

    /* Modal detalle */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 60;
    }

    .modal-backdrop.open {
      display: flex;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-card {
      background: #fff;
      border-radius: 22px;
      max-width: 600px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 28px;
      box-shadow: var(--shadow-lg);
      animation: viewFadeUp 0.3s ease;
    }

    .detail-item {
      background: #F8FAFC;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
      border-left: 4px solid var(--primary);
    }

    .detail-item small {
      display: block;
      font-weight: 800;
      color: var(--muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      font-size: 0.72rem;
    }

    .actions-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 20px;
    }

    @media (max-width: 640px) {
      .card {
        padding: 24px 18px;
      }
      .topbar {
        padding: 12px 16px;
      }
    }
  </style>
</head>

          <div style="font-size: 2.8rem; margin-bottom: 8px;">🎓</div>
          <h2 style="font-size: 1.6rem; font-weight: 800; margin-bottom: 8px;">Ingreso de Estudiante</h2>
          <p style="color: var(--muted); margin-bottom: 24px;">Ingresa tu nombre para comenzar tu registro confidencial.</p>

          <div class="field-group">
            <label class="field-label" for="studentNameInput">Nombre completo</label>
            <input id="studentNameInput" class="input" type="text" placeholder="Escribe tu nombre completo..." />
          </div>

          <div class="actions-row">
            <button class="btn btn-primary" onclick="handleStudentLogin()">Comenzar →</button>
            <button class="btn btn-ghost" onclick="showLoginOptions()">Volver</button>
          </div>
        </div>
      `);
    }

    function handleStudentLogin() {
      const name = document.getElementById("studentNameInput").value.trim();
      if (!name) {
        showToast("Por favor ingresa tu nombre", "error");
        return;
      }
      state.role = "student";
      state.userName = name;
      showEmotionStep();
    }

    function showTeacherLogin() {
      renderView(`
        <div class="card centered-card">
          <div style="font-size: 2.8rem; margin-bottom: 8px;">👨‍🏫</div>
          <h2 style="font-size: 1.6rem; font-weight: 800; margin-bottom: 8px;">Acceso Docente</h2>
          <p style="color: var(--muted); margin-bottom: 24px;">Verifica tu correo institucional autorizado para ver el dashboard.</p>

          <div class="field-group">
            <label class="field-label" for="teacherEmailInput">Correo autorizado</label>
            <input id="teacherEmailInput" class="input" type="email" placeholder="tu@correo.com" />
          </div>

          <div class="actions-row">
            <button class="btn btn-primary" onclick="handleTeacherLogin()">Verificar Acceso</button>
            <button class="btn btn-ghost" onclick="showLoginOptions()">Volver</button>
          </div>
        </div>
      `);
    }

    function handleTeacherLogin() {
      const email = document.getElementById("teacherEmailInput").value.trim().toLowerCase();
      if (AUTHORIZED_TEACHERS[email]) {
        state.role = "teacher";
        state.userName = AUTHORIZED_TEACHERS[email];
        showToast(`Bienvenido, ${state.userName}`, "success");
        showTeacherDashboard();
      } else {
        showToast("Correo no autorizado", "error");
      }
    }

    // =========================================================================
    // FLUJO ESTUDIANTE (student_view.py)
    // =========================================================================
    function studentProgressBar(stepNum, stepTitle) {
      const pct = (stepNum / 5) * 100;
      return `
        <div class="progress-wrap">
          <div class="progress-meta">
            <span>Paso ${stepNum} de 5 · ${stepTitle}</span>
            <span>${Math.round(pct)}%</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" style="width: ${pct}%;"></div>
          </div>
        </div>
      `;
    }

    function showEmotionStep() {
      const buttonsHtml = EMOTIONS.map(em => {
        const [emoji, ...rest] = em.label.split(" ");
        const text = rest.join(" ");
        const isSelected = state.studentData.emotion === em.label ? "selected" : "";
        return `
          <button type="button" class="emotion-btn ${isSelected}" onclick="selectEmotion('${em.label.replace(/'/g, "\\'")}')">
            <span class="emoji">${emoji}</span>
            <span>${text}</span>
          </button>
        `;
      }).join("");

      renderView(`
        <div class="card centered-card">
          ${studentProgressBar(1, "Estado emocional")}
          <h2 style="font-size: 1.7rem; font-weight: 800; color: var(--primary-dark);">
            ¿Cómo te sientes hoy, ${escapeHtml(state.userName)}?
          </h2>
          <p style="color: var(--muted); margin-top: 8px;">Selecciona la emoción que mejor describe tu día.</p>

          <div class="emotions-grid">
            ${buttonsHtml}
          </div>

          <div class="actions-row">
            <button class="btn btn-ghost" onclick="goHome()">Cancelar</button>
          </div>
        </div>
      `);
    }

    function selectEmotion(emotion) {
      state.studentData.emotion = emotion;
      showEmotionReasonStep();
    }

    function showEmotionReasonStep() {
      renderView(`
        <div class="card centered-card">
          ${studentProgressBar(2, "Contexto emocional")}
          <div style="display:inline-block; background:var(--primary-soft); color:var(--primary-dark); padding:6px 14px; border-radius:999px; font-weight:700; font-size:0.88rem; margin-bottom:12px;">
            Has seleccionado: ${escapeHtml(state.studentData.emotion)}
          </div>
          <h2 style="font-size: 1.55rem; font-weight: 800; margin-bottom: 18px;">
            ¿Por qué te sientes así?
          </h2>

          <div class="field-group">
            <textarea id="reasonTextarea" class="textarea" placeholder="Cuéntanos qué ha pasado hoy...">${escapeHtml(state.studentData.emotionReason)}</textarea>
          </div>

          <div class="actions-row">
            <button class="btn btn-ghost" onclick="showEmotionStep()">← Atrás</button>
            <button class="btn btn-primary" onclick="saveReasonAndContinue()">Continuar →</button>
          </div>
        </div>
      `);
    }

    function saveReasonAndContinue() {
      const val = document.getElementById("reasonTextarea").value.trim();
      if (!val) {
        showToast("Por favor explica por qué te sientes así", "error");
        return;
      }
      state.studentData.emotionReason = val;
      showTopicStep();
    }

    function showTopicStep() {
      const topicsHtml = TOPICS.map(t => `
        <button type="button" class="topic-btn" onclick="selectTopic('${t.replace(/'/g, "\\'")}')">
          ${escapeHtml(t)}
        </button>
      `).join("");

      renderView(`
        <div class="card centered-card">
          ${studentProgressBar(3, "Tema de orientación")}
          <h2 style="font-size: 1.55rem; font-weight: 800; color: var(--primary-dark);">
            ¿En qué te gustaría que te orientaran?
          </h2>
          <p style="color: var(--muted); margin-top: 8px;">Elige el tema principal sobre el que deseas apoyo.</p>

          <div class="topics-grid">
            ${topicsHtml}
          </div>

          <div class="actions-row">
            <button class="btn btn-ghost" onclick="showEmotionReasonStep()">← Atrás</button>
          </div>
        </div>
      `);
    }

    function selectTopic(topic) {
      state.studentData.topic = topic;
      showTopicDetailStep();
    }

    function showTopicDetailStep() {
      renderView(`
        <div class="card centered-card">
          ${studentProgressBar(4, "Detalles del tema")}
          <div style="display:inline-block; background:#FEF3C7; color:#92400E; padding:6px 14px; border-radius:999px; font-weight:700; font-size:0.88rem; margin-bottom:12px;">
            Tema: ${escapeHtml(state.studentData.topic)}
          </div>
          <h2 style="font-size: 1.55rem; font-weight: 800; margin-bottom: 18px;">
            Cuéntanos más sobre esto:
          </h2>

          <div class="field-group">
            <textarea id="topicDetailTextarea" class="textarea" placeholder="Escribe los detalles que consideres importantes...">${escapeHtml(state.studentData.topicDetail)}</textarea>
          </div>

          <div class="actions-row">
            <button class="btn btn-ghost" onclick="showTopicStep()">← Atrás</button>
            <button class="btn btn-primary" onclick="saveTopicAndContinue()">Continuar →</button>
          </div>
        </div>
      `);
    }

    function saveTopicAndContinue() {
      const val = document.getElementById("topicDetailTextarea").value.trim();
      if (!val) {
        showToast("Por favor cuéntanos más sobre el tema seleccionado", "error");
        return;
      }
      state.studentData.topicDetail = val;
      showImportantStep();
    }

    function showImportantStep() {
      renderView(`
        <div class="card centered-card">
          ${studentProgressBar(5, "Situación importante")}
          <h2 style="font-size: 1.55rem; font-weight: 800; color: var(--primary-dark); margin-bottom: 8px;">
            ¿Hay alguna situación que hoy te afecte mucho?
          </h2>
          <p style="color: var(--muted); margin-bottom: 18px;">Compártenos con confianza:</p>

          <div class="field-group">
            <textarea id="importantTextarea" class="textarea" placeholder="Este espacio es confidencial...">${escapeHtml(state.studentData.importantSituation)}</textarea>
          </div>

          <div class="actions-row">
            <button class="btn btn-ghost" onclick="showTopicDetailStep()">← Atrás</button>
            <button class="btn btn-primary" id="submitBtn" onclick="submitStudentResponses()">Enviar respuestas ✨</button>
          </div>
        </div>
      `);
    }

    async function submitStudentResponses() {
      const val = document.getElementById("importantTextarea").value.trim();
      if (!val) {
        showToast("Por favor compártenos tu situación importante", "error");
        return;
      }
      state.studentData.importantSituation = val;

      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.textContent = "Enviando...";

      const payload = {
        studentName: state.userName,
        emotion: state.studentData.emotion,
        emotionReason: state.studentData.emotionReason,
        topic: state.studentData.topic,
        topicDetail: state.studentData.topicDetail,
        importantSituation: state.studentData.importantSituation
      };

      let savedOk = false;

      if (APPS_SCRIPT_URL) {
        try {
          const res = await fetch(APPS_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          savedOk = true;
        } catch (err) {
          console.error(err);
          savedOk = false;
        }
      } else {
        // Guardar localmente en demo si no hay URL configurada
        DEMO_RECORDS.push({
          "Fecha": new Date().toISOString().replace("T", " ").slice(0, 19),
          "Nombre Estudiante": payload.studentName,
          "Emoción": payload.emotion,
          "Razón Emoción": payload.emotionReason,
          "Tema Orientación": payload.topic,
          "Detalle Tema": payload.topicDetail,
          "Situación Importante": payload.importantSituation,
          "Tiempo Respuesta": "Completado"
        });
        savedOk = true;
      }

      renderView(`
        <div class="card centered-card">
          <div style="font-size: 3.5rem; margin-bottom: 12px;">${savedOk ? "✨" : "⚠️"}</div>
          <h2 style="font-size: 1.7rem; font-weight: 800; color: ${savedOk ? "var(--primary-dark)" : "var(--danger)"}; margin-bottom: 12px;">
            ${savedOk ? "¡Gracias por compartir tu experiencia!" : "Hubo un inconveniente al enviar"}
          </h2>
          <p style="color: var(--muted); line-height: 1.6; margin-bottom: 24px;">
            ${savedOk
              ? "Tus respuestas han sido registradas exitosamente para el equipo de orientación."
              : "Por favor verifica la conexión o contacta al administrador."}
          </p>
          <div class="actions-row">
            <button class="btn btn-primary" onclick="goHome()">Finalizar</button>
          </div>
        </div>
      `);
    }

    // =========================================================================
    // DASHBOARD PROFESOR (teacher_view.py)
    // =========================================================================
    async function showTeacherDashboard() {
      renderView(`
        <div class="dash-header">
          <div>
            <h2 style="font-size: 1.7rem; font-weight: 800;">📊 Dashboard de Orientación Escolar</h2>
            <p style="color: var(--muted); font-size: 0.9rem;">Sesión activa: <strong>${escapeHtml(state.userName)}</strong></p>
          </div>
          <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <button class="btn btn-primary" onclick="loadTeacherData()">🔄 Actualizar Datos</button>
            <button class="btn btn-danger" onclick="goHome()">🚪 Cerrar Sesión</button>
          </div>
        </div>
        <div id="dashboardContent">
          <div class="card centered-card">Cargando registros...</div>
        </div>
      `);

      await loadTeacherData();
    }

    async function loadTeacherData() {
      const contentEl = document.getElementById("dashboardContent");
      if (!contentEl) return;

      let records = [];
      if (APPS_SCRIPT_URL) {
        try {
          const resp = await fetch(APPS_SCRIPT_URL);
          records = await resp.json();
        } catch (e) {
          showToast("No se pudo leer Google Sheets; mostrando datos de respaldo", "error");
          records = DEMO_RECORDS;
        }
      } else {
        records = DEMO_RECORDS;
      }

      state.records = records;
      destroyCharts();

      if (!records || records.length === 0) {
        contentEl.innerHTML = `
          <div class="card centered-card">
            <div style="font-size: 3.5rem; margin-bottom: 12px;">📭</div>
            <h3 style="font-size: 1.35rem; font-weight: 800; margin-bottom: 8px;">No hay respuestas registradas todavía</h3>
            <p style="color: var(--muted);">Las respuestas de los estudiantes aparecerán aquí automáticamente.</p>
          </div>
        `;
        return;
      }

      const total = records.length;
      const emotionCounts = countBy(records, "Emoción");
      const topicCounts = countBy(records, "Tema Orientación");
      const uniqueStudents = new Set(records.map(r => r["Nombre Estudiante"]).filter(Boolean)).size;

      const topEmotion = emotionCounts[0] ? `${emotionCounts[0][0]} (${emotionCounts[0][1]})` : "N/A";
      const topTopic = topicCounts[0] ? `${topicCounts[0][0]} (${topicCounts[0][1]})` : "N/A";

      const sortedRows = [...records].sort((a, b) => String(b["Fecha"] || "").localeCompare(String(a["Fecha"] || ""))).slice(0, 20);

      const tableRowsHtml = sortedRows.map((row, idx) => `
        <tr>
          <td><strong>${idx + 1}</strong></td>
          <td>${escapeHtml(row["Nombre Estudiante"] || "")}</td>
          <td>${escapeHtml(row["Emoción"] || "")}</td>
          <td>${escapeHtml(row["Tema Orientación"] || "")}</td>
          <td>${escapeHtml(String(row["Fecha"] || "").slice(0, 10))}</td>
          <td>
            <button class="btn btn-primary" style="padding: 7px 14px; font-size: 0.8rem; border-radius: 10px;" onclick="openDetailModal(${idx})">
              🔍 Ver
            </button>
          </td>
        </tr>
      `).join("");

      contentEl.innerHTML = `
        <div class="kpi-grid">
          <div class="kpi-card" style="border-top-color: var(--primary);">
            <div class="kpi-top"><span>Total de Respuestas</span><span class="kpi-icon">📋</span></div>
            <div class="kpi-value" style="color: var(--primary-dark);">${total}</div>
          </div>
          <div class="kpi-card" style="border-top-color: var(--secondary);">
            <div class="kpi-top"><span>Emoción más común</span><span class="kpi-icon">😊</span></div>
            <div class="kpi-value" style="font-size: 1.2rem;">${escapeHtml(topEmotion)}</div>
          </div>
          <div class="kpi-card" style="border-top-color: var(--warning);">
            <div class="kpi-top"><span>Tema más consultado</span><span class="kpi-icon">📚</span></div>
            <div class="kpi-value" style="font-size: 1.2rem;">${escapeHtml(topTopic)}</div>
          </div>
          <div class="kpi-card" style="border-top-color: var(--danger);">
            <div class="kpi-top"><span>Estudiantes atendidos</span><span class="kpi-icon">👨‍🎓</span></div>
            <div class="kpi-value" style="color: var(--danger);">${uniqueStudents}</div>
          </div>
        </div>

        <div class="charts-grid">
          <div class="chart-box">
            <div class="chart-title">📊 Distribución de Emociones</div>
            <canvas id="emotionChart"></canvas>
          </div>
          <div class="chart-box">
            <div class="chart-title">📚 Temas de Orientación</div>
            <canvas id="topicChart"></canvas>
          </div>
          <div class="chart-box full-width">
            <div class="chart-title">📈 Respuestas por Día</div>
            <canvas id="timelineChart"></canvas>
          </div>
        </div>

        <div class="table-wrap">
          <div class="chart-title">📝 Últimas Respuestas</div>
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Estudiante</th>
                <th>Emoción</th>
                <th>Tema</th>
                <th>Fecha</th>
                <th>Detalles</th>
              </tr>
            </thead>
            <tbody>
              ${tableRowsHtml}
            </tbody>
          </table>
        </div>
      `;

      renderCharts(records, emotionCounts, topicCounts);
    }

    function countBy(records, key) {
      const map = {};
      records.forEach(r => {
        const val = r[key] || "Sin especificar";
        map[val] = (map[val] || 0) + 1;
      });
      return Object.entries(map).sort((a, b) => b[1] - a[1]);
    }

    function renderCharts(records, emotionCounts, topicCounts) {
      const palette = ["#42D900", "#FBCA15", "#FE0C24", "#FAA441", "#3B82F6", "#8B5CF6", "#EC4899", "#14B8A6"];

      const c1 = new Chart(document.getElementById("emotionChart"), {
        type: "bar",
        data: {
          labels: emotionCounts.map(x => x[0]),
          datasets: [{
            label: "Estudiantes",
            data: emotionCounts.map(x => x[1]),
            backgroundColor: palette,
            borderRadius: 8
          }]
        },
        options: {
          indexAxis: "y",
          responsive: true,
          plugins: { legend: { display: false } }
        }
      });

      const c2 = new Chart(document.getElementById("topicChart"), {
        type: "doughnut",
        data: {
          labels: topicCounts.map(x => x[0]),
          datasets: [{
            data: topicCounts.map(x => x[1]),
            backgroundColor: palette
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { position: "bottom" } }
        }
      });

      const dateMap = {};
      records.forEach(r => {
        const d = String(r["Fecha"] || "").slice(0, 10) || "Sin fecha";
        dateMap[d] = (dateMap[d] || 0) + 1;
      });
      const sortedDates = Object.keys(dateMap).sort();

      const c3 = new Chart(document.getElementById("timelineChart"), {
        type: "line",
        data: {
          labels: sortedDates,
          datasets: [{
            label: "Respuestas",
            data: sortedDates.map(d => dateMap[d]),
            borderColor: "#42D900",
            backgroundColor: "rgba(66, 217, 0, 0.16)",
            fill: true,
            tension: 0.35,
            pointRadius: 5
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } }
        }
      });

      state.charts.push(c1, c2, c3);
    }

    function openDetailModal(index) {
      const sorted = [...state.records].sort((a, b) => String(b["Fecha"] || "").localeCompare(String(a["Fecha"] || ""))).slice(0, 20);
      const item = sorted[index];
      if (!item) return;

      const fields = [
        ["👨‍🎓 Estudiante", item["Nombre Estudiante"]],
        ["📅 Fecha", item["Fecha"]],
        ["😊 Emoción", item["Emoción"]],
        ["💭 Razón de la Emoción", item["Razón Emoción"]],
        ["📚 Tema de Orientación", item["Tema Orientación"]],
        ["✏️ Detalle del Tema", item["Detalle Tema"]],
        ["❤️ Situación Importante", item["Situación Importante"]]
      ];

      document.getElementById("detailModalContent").innerHTML = `
        <h3 style="font-size: 1.35rem; font-weight: 800; color: var(--primary-dark); margin-bottom: 16px;">
          📋 Detalle de la Respuesta
        </h3>
        ${fields.map(([label, val]) => `
          <div class="detail-item">
            <small>${label}</small>
            <div>${escapeHtml(val || "No especificado")}</div>
          </div>
        `).join("")}
        <div class="actions-row">
          <button class="btn btn-primary" onclick="closeModal()">Cerrar</button>
        </div>
      `;
      document.getElementById("detailModal").classList.add("open");
    }

    function closeModal() {
      document.getElementById("detailModal").classList.remove("open");
    }

    function closeModalOnBackdrop(e) {
      if (e.target.id === "detailModal") closeModal();
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Iniciar app
    showLoginOptions();
  </script>
</body>
</html>
